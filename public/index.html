<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片转 PDF</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f5f7;--surface:#fff;--surface2:#f0f0f2;
    --border:#d8d8dd;--text:#1d1d1f;--text2:#6e6e73;
    --accent:#5856d6;--accent-hover:#4744c5;
    --danger:#ff3b30;--success:#34c759;
    --radius:10px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:24px 16px;
  }
  h1{font-size:1.6rem;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
  .subtitle{color:var(--text2);font-size:.85rem;margin-bottom:28px}
  .container{width:100%;max-width:680px}

  .drop-zone{
    border:2px dashed var(--border);border-radius:var(--radius);
    padding:48px 24px;text-align:center;cursor:pointer;
    transition:all .2s;background:var(--surface);
    touch-action:manipulation;
  }
  .drop-zone:hover,.drop-zone.drag-over{
    border-color:var(--accent);background:rgba(88,86,214,.04);
  }
  .drop-zone svg{margin-bottom:12px;opacity:.35}
  .drop-zone p{color:var(--text2);font-size:.9rem;line-height:1.6}
  .drop-zone .hint{font-size:.75rem;color:var(--text2);opacity:.6;margin-top:8px}
  .drop-zone input{display:none}

  .controls{
    display:flex;gap:8px;margin-top:12px;
  }
  .btn{
    flex:1;padding:12px;border:none;border-radius:var(--radius);
    font-size:.9rem;font-weight:600;cursor:pointer;
    transition:all .15s;touch-action:manipulation;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--accent-hover)}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed}
  .btn-secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--border);color:var(--text)}

  .file-info{
    display:none;align-items:center;justify-content:space-between;
    margin:12px 0 8px;padding:8px 14px;
    background:var(--surface);border-radius:var(--radius);
    font-size:.82rem;color:var(--text2);border:1px solid var(--border);
  }
  .file-info .count{color:var(--accent);font-weight:600}

  .image-list{
    display:flex;flex-direction:column;gap:6px;
    max-height:280px;overflow-y:auto;
    padding:2px;margin-bottom:12px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .image-list::-webkit-scrollbar{width:5px}
  .image-list::-webkit-scrollbar-track{background:transparent}
  .image-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .image-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;background:var(--surface);
    border-radius:8px;border:1px solid var(--border);
    transition:border-color .15s;
  }
  .image-item:hover{border-color:var(--accent)}
  .image-item .thumb{
    width:44px;height:44px;border-radius:5px;object-fit:cover;
    background:var(--surface2);flex-shrink:0;
  }
  .image-item .info{flex:1;min-width:0}
  .image-item .name{
    font-size:.8rem;font-weight:500;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .image-item .meta{font-size:.7rem;color:var(--text2);margin-top:1px}
  .image-item .actions{display:flex;gap:3px;flex-shrink:0}
  .btn-icon{
    width:28px;height:28px;border:none;border-radius:5px;
    background:var(--surface2);color:var(--text2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;font-size:.7rem;border:1px solid var(--border);
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  .btn-icon:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-icon.danger:hover{background:var(--danger);border-color:var(--danger)}

  .progress{margin-top:12px;display:none}
  .progress.active{display:block}
  .progress-bar{
    height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;
    border:1px solid var(--border);
  }
  .progress-bar .fill{
    height:100%;background:var(--accent);border-radius:3px;
    transition:width .3s;width:0;
  }
  .progress-text{
    font-size:.76rem;color:var(--text2);margin-top:6px;text-align:center;
  }

  .limits{
    margin-top:16px;padding:12px 14px;background:var(--surface);
    border-radius:var(--radius);font-size:.73rem;color:var(--text2);
    line-height:1.7;border:1px solid var(--border);
  }
  .limits strong{color:var(--text)}

  @media(max-width:480px){
    body{padding:16px 10px}
    .drop-zone{padding:32px 16px}
    .drop-zone svg{width:32px;height:32px}
    h1{font-size:1.3rem}
    .image-list{max-height:220px}
  }
  @media(max-width:360px){
    body{padding:12px 8px}
    .drop-zone{padding:24px 12px}
    .drop-zone svg{width:28px;height:28px}
    .drop-zone p{font-size:.82rem}
    .image-item{padding:6px 8px;gap:8px}
    .image-item .thumb{width:38px;height:38px}
    .btn-icon{width:30px;height:30px;font-size:.8rem}
    .controls{gap:6px}
    .btn{padding:11px 8px;font-size:.85rem}
    .limits{font-size:.7rem;padding:10px 12px}
  }
</style>
</head>
<body>

<div class="container">
  <h1>图片转 PDF</h1>
  <p class="subtitle">上传图片，生成 A4 尺寸的 PDF 文件（图片没有上传至任何服务器，所有处理都在您的浏览器中进行）</p>

  <div class="drop-zone" id="dropZone">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>拖拽图片到这里，或 <strong>点击选择文件</strong></p>
    <p class="hint">支持 JPG / PNG · 单张最大 10 MB</p>
    <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,image/jpeg,image/png">
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="generateBtn" disabled>生成 PDF</button>
    <button class="btn btn-secondary" id="clearBtn" style="display:none">清空</button>
  </div>

  <div class="file-info" id="fileInfo">
    <span>已选择 <span class="count" id="fileCount">0</span> 张图片</span>
    <span id="totalSize"></span>
  </div>

  <div class="image-list" id="imageList"></div>

  <div class="progress" id="progress">
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">处理中...</p>
  </div>

  <div class="limits">
    <strong>限制：</strong>单张 10 MB 以内 · 仅支持 JPG 和 PNG<br>
    每页 A4（210×297mm），图片以最长边居中撑满，空白区域自动补白。
  </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function(){
  const MAX_SIZE = 10 * 1024 * 1024;
  const A4_W = 595.28;
  const A4_H = 841.89;

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const fileCount = document.getElementById('fileCount');
  const totalSizeEl = document.getElementById('totalSize');
  const imageList = document.getElementById('imageList');
  const generateBtn = document.getElementById('generateBtn');
  const clearBtn = document.getElementById('clearBtn');
  const progress = document.getElementById('progress');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');

  let files = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  generateBtn.addEventListener('click', generatePDF);
  clearBtn.addEventListener('click', clearAll);

  function addFiles(fileList) {
    const valid = Array.from(fileList).filter(f => {
      const isExtValid = /\.(jpe?g|png)$/i.test(f.name);
      const isMimeValid = /image\/(jpeg|png)/i.test(f.type);
      if (!isExtValid && !isMimeValid) { alert('仅支持 JPG 和 PNG 格式'); return false; }
      if (f.size > MAX_SIZE) { alert(f.name + ' 超过 10 MB 限制'); return false; }
      return true;
    });
    valid.forEach(f => {
      f._id = Math.random().toString(36).slice(2);
      f._url = URL.createObjectURL(f);
      files.push(f);
    });
    render();
  }

  function removeFile(id) {
    const idx = files.findIndex(f => f._id === id);
    if (idx >= 0) { URL.revokeObjectURL(files[idx]._url); files.splice(idx, 1); }
    render();
  }

  function moveFile(id, dir) {
    const idx = files.findIndex(f => f._id === id);
    const next = idx + dir;
    if (next < 0 || next >= files.length) return;
    [files[idx], files[next]] = [files[next], files[idx]];
    render();
  }

  function clearAll() {
    files.forEach(f => URL.revokeObjectURL(f._url));
    files = [];
    render();
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function render() {
    imageList.innerHTML = '';
    files.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'image-item';
      div.innerHTML = '<img class="thumb" src="' + f._url + '" alt="">'
        + '<div class="info">'
        + '<div class="name">' + f.name + '</div>'
        + '<div class="meta">#' + (i + 1) + ' · ' + formatSize(f.size) + '</div>'
        + '</div>'
        + '<div class="actions">'
        + '<button class="btn-icon" data-action="up" title="上移">▲</button>'
        + '<button class="btn-icon" data-action="down" title="下移">▼</button>'
        + '<button class="btn-icon danger" data-action="remove" title="移除">✕</button>'
        + '</div>';
      div.querySelector('[data-action="up"]').addEventListener('click', function(){ moveFile(f._id, -1); });
      div.querySelector('[data-action="down"]').addEventListener('click', function(){ moveFile(f._id, 1); });
      div.querySelector('[data-action="remove"]').addEventListener('click', function(){ removeFile(f._id); });
      imageList.appendChild(div);
    });

    var hasFiles = files.length > 0;
    fileInfo.style.display = hasFiles ? 'flex' : 'none';
    fileCount.textContent = files.length;
    totalSizeEl.textContent = formatSize(files.reduce(function(s, f){ return s + f.size; }, 0));
    generateBtn.disabled = !hasFiles;
    clearBtn.style.display = hasFiles ? 'block' : 'none';
  }

  /**
   * 将文件读取为 ArrayBuffer
   * @param {File} file 文件对象
   * @returns {Promise<ArrayBuffer>} 二进制数据
   */
  function readFileAsArrayBuffer(file) {
    return new Promise(function(resolve, reject) {
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = reject;
      r.readAsArrayBuffer(file);
    });
  }

  /**
   * 加载图片元素以获取自然尺寸及供 Canvas 回退使用
   * @param {File} file 文件对象
   * @returns {Promise<{img: HTMLImageElement, w: number, h: number, revoke: Function}>}
   */
  function loadImageElement(file) {
    return new Promise(function(resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function() {
        resolve({
          img: img,
          w: img.naturalWidth,
          h: img.naturalHeight,
          revoke: function() { URL.revokeObjectURL(url); }
        });
      };
      img.onerror = function() {
        URL.revokeObjectURL(url);
        reject(new Error('无法解析图片文件，可能文件已损坏'));
      };
      img.src = url;
    });
  }

  /**
   * 根据二进制数据头（Magic Number）判断真实图片格式
   * @param {Uint8Array} bytes 图片二进制数组
   * @returns {'jpeg' | 'png' | 'unknown'} 真实格式
   */
  function detectImageType(bytes) {
    // NOTE: JPEG 文件头标志 0xFF 0xD8
    if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xD8) {
      return 'jpeg';
    }
    // NOTE: PNG 文件头标志 0x89 0x50 0x4E 0x47 0x0D 0x0A 0x1A 0x0A
    if (
      bytes.length >= 8 &&
      bytes[0] === 0x89 &&
      bytes[1] === 0x50 &&
      bytes[2] === 0x4E &&
      bytes[3] === 0x47 &&
      bytes[4] === 0x0D &&
      bytes[5] === 0x0A &&
      bytes[6] === 0x1A &&
      bytes[7] === 0x0A
    ) {
      return 'png';
    }
    return 'unknown';
  }

  /**
   * 通过 Canvas 将图片转为标准的 JPEG ArrayBuffer（用于格式回退与容错）
   * @param {HTMLImageElement} img 图片元素
   * @returns {Promise<ArrayBuffer>} 标准 JPEG 二进制数据
   */
  function convertImageToJpegBuffer(img) {
    return new Promise(function(resolve, reject) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        var ctx = canvas.getContext('2d');
        // NOTE: 填充白色底色，避免透明背景 PNG 转 JPEG 时背景变黑
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        canvas.toBlob(function(blob) {
          if (!blob) {
            reject(new Error('Canvas 导出图片数据失败'));
            return;
          }
          var reader = new FileReader();
          reader.onload = function() { resolve(reader.result); };
          reader.onerror = reject;
          reader.readAsArrayBuffer(blob);
        }, 'image/jpeg', 0.95);
      } catch (err) {
        reject(err);
      }
    });
  }

  /**
   * 将图片安全嵌入到 PDF 文档中，内置类型自适应与 Canvas 回退机制
   * @param {PDFDocument} pdfDoc PDF-Lib 文档实例
   * @param {ArrayBuffer} buf 图片 ArrayBuffer
   * @param {HTMLImageElement} img 图片 DOM 元素
   * @returns {Promise<PDFImage>} 嵌入后的 PDF 图片对象
   */
  async function embedImageSafely(pdfDoc, buf, img) {
    var bytes = new Uint8Array(buf);
    var realType = detectImageType(bytes);

    // 1. 优先按文件真实二进制头尝试原生嵌入
    if (realType === 'jpeg') {
      try {
        return await pdfDoc.embedJpg(buf);
      } catch (e) {
        console.warn('直接嵌入 JPEG 失败，将使用 Canvas 转码后重试', e);
      }
    } else if (realType === 'png') {
      try {
        return await pdfDoc.embedPng(buf);
      } catch (e) {
        console.warn('直接嵌入 PNG 失败，将使用 Canvas 转码后重试', e);
      }
    }

    // 2. NOTE: 回退方案：当二进制头非标准，或 pdf-lib 不支持某些特定色彩空间时，通过 Canvas 重新绘制并转码为兼容的 JPEG
    var fallbackBuf = await convertImageToJpegBuffer(img);
    return await pdfDoc.embedJpg(fallbackBuf);
  }

  async function generatePDF() {
    if (!files.length) return;

    if (typeof PDFLib === 'undefined') {
      alert('PDF 核心组件尚未加载完成，请稍候重试或检查网络');
      return;
    }

    generateBtn.disabled = true;
    clearBtn.style.display = 'none';
    progress.classList.add('active');
    progressFill.style.width = '0%';
    progressText.textContent = '正在加载...';

    try {
      var PDFDocument = PDFLib.PDFDocument;
      var rgb = PDFLib.rgb;
      var pdfDoc = await PDFDocument.create();

      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var pct = Math.round((i / files.length) * 100);
        progressFill.style.width = pct + '%';
        progressText.textContent = '正在处理第 ' + (i + 1) + ' / ' + files.length + ' 张图片...';

        var results = await Promise.all([
          readFileAsArrayBuffer(f),
          loadImageElement(f)
        ]);
        var buf = results[0];
        var imgInfo = results[1];

        var embedded;
        try {
          embedded = await embedImageSafely(pdfDoc, buf, imgInfo.img);
        } finally {
          // 及时释放对象 URL，防止移动端与大图内存占用过高
          imgInfo.revoke();
        }

        var page = pdfDoc.addPage([A4_W, A4_H]);

        // 填充白色背景
        page.drawRectangle({
          x: 0, y: 0, width: A4_W, height: A4_H,
          color: rgb(1, 1, 1),
        });

        // NOTE: 等比例缩放（contain），按最长边自适应适应 A4 页面尺寸，保证不裁切且多余区域自动补白
        var scale = Math.min(A4_W / imgInfo.w, A4_H / imgInfo.h);
        var drawW = imgInfo.w * scale;
        var drawH = imgInfo.h * scale;

        // NOTE: 居中放置图片
        var x = (A4_W - drawW) / 2;
        var y = (A4_H - drawH) / 2;

        page.drawImage(embedded, { x: x, y: y, width: drawW, height: drawH });
      }

      progressFill.style.width = '100%';
      progressText.textContent = '正在生成 PDF...';

      var pdfBytes = await pdfDoc.save();
      var blob = new Blob([pdfBytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);

      var a = document.createElement('a');
      a.href = url;
      a.download = 'images.pdf';
      a.click();
      URL.revokeObjectURL(url);

      progressText.textContent = '完成！PDF 已下载。';
      setTimeout(function(){ progress.classList.remove('active'); }, 2000);
    } catch (err) {
      console.error(err);
      // NOTE: 规范化错误提示，避免显示 undefined
      var errorMsg = (err && (err.message || (typeof err === 'string' ? err : JSON.stringify(err)))) || '处理图片时发生未知错误';
      progressText.textContent = '出错了：' + errorMsg;
      progressFill.style.width = '0%';
    } finally {
      generateBtn.disabled = false;
      clearBtn.style.display = files.length ? 'block' : 'none';
    }
  }
})();
</script>
</body>
</html>
